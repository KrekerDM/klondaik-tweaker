<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://app.klondaik; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
    <title>Klondaik Tweaker</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="veil"></div>
    <div class="progress"><i id="progbar"></i></div>

    <div class="frame">
      <header class="titlebar">
        <div class="brand"><b>KL</b><i></i><span>Tweaker</span></div>
        <div class="drag" id="drag"></div>
        <div class="row" style="gap: 8px; padding-right: 8px">
          <span class="tag plain mono" id="verTag">1.0.0</span>
          <button class="chip" id="langBtn">RU</button>
        </div>
        <div class="winbtns">
          <button class="winbtn" data-win="min" title="Свернуть">
            <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button class="winbtn" data-win="max" title="Развернуть">
            <svg viewBox="0 0 12 12" width="12" height="12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button class="winbtn close" data-win="close" title="Закрыть">
            <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
        </div>
      </header>

      <div class="body">
        <nav class="sidebar" id="nav"></nav>
        <main class="content" id="content"></main>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>
    <div id="modalRoot"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>

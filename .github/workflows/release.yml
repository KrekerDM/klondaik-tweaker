name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate data files
        working-directory: tools
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $scripts = @(
            "gen_tweaks.py",
            "gen_wizard.py",
            "gen_software.py",
            "gen_repair.py",
            "gen_features.py",
            "gen_tasks.py",
            "get_inspector.py",
            "gen_credits.py"
          )
          foreach ($script in $scripts) {
            Write-Host "--- $script"
            python $script
            if ($LASTEXITCODE -ne 0) { throw "$script exited with $LASTEXITCODE" }
          }

      - name: Fail if generated data differs from the commit
        run: |
          git diff --exit-code -- src/KlondaikTweaker/Assets/Data

      - name: Fail if the bundled tools are missing
        shell: pwsh
        run: |
          $exe = "src/KlondaikTweaker/Assets/vendor/nvidiaProfileInspector.exe"
          if (-not (Test-Path $exe)) { throw "Profile Inspector was not bundled, the NVIDIA tab would be dead" }
          $size = (Get-Item $exe).Length
          if ($size -lt 200KB) { throw "bundled Profile Inspector is only $size bytes" }
          Write-Host "Profile Inspector bundled, $([math]::Round($size / 1KB)) KB"

      - name: Publish
        run: dotnet publish src/KlondaikTweaker/KlondaikTweaker.csproj -c Release -o dist --nologo

      - name: Check the artifact
        shell: pwsh
        run: |
          $exe = "dist/KlondaikTweaker.exe"
          if (-not (Test-Path $exe)) { throw "publish produced no exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "KlondaikTweaker.exe is $size MB"
          if ($size -lt 20) { throw "artifact is suspiciously small" }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Out-File dist/KlondaikTweaker.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: KlondaikTweaker
          path: |
            dist/KlondaikTweaker.exe
            dist/KlondaikTweaker.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/KlondaikTweaker.exe
            dist/KlondaikTweaker.exe.sha256
